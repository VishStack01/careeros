# Job platforms CareerOS searches, beyond company career pages.
#
# access
#   feed    public JSON/RSS; scanned automatically every 3 hours by `careeros scan`
#   fetch   public pages; the agent reads them in its run (WebFetch / WebSearch)
#   login   listings or applying need your account; the agent finds roles and
#           prepares the application, you press submit (never automated logins)
#   alerts  big boards whose terms forbid automation; set up their email alerts,
#           the Gmail tracker reads them
#   planned job-search APIs that need a free key; not used yet
# competition   rough applicants per role: low (<50), medium, high (500+)
# every_run     the agent checks it every 3-hour run; others rotate (about a third per run)
# verify        the URL pattern hasn't been checked yet; the first run confirms or fixes it
#
# Why ~90 and not 500: past about a hundred, "job sites" are mostly clones and
# scrapers re-posting the same listings (often stale), or sites that only show
# jobs after login. Searching them adds duplicates, not openings. The real reach
# comes from the ~1,000 company career pages in config/companies/.

# ------------------------------------------------------------ remote boards with public feeds (scanned)

