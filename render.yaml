# One-click deploy on Render: a PostgreSQL database, the web app and the worker.
# After the first deploy, set PUBLIC_URL (your https://...onrender.com or custom domain),
# SMTP_URL, MAIL_FROM, SUPPORT_EMAIL and BOOTSTRAP_ADMIN_EMAIL in the dashboard, then redeploy.
# Optional: CAREEROS_LLM + a provider key for the hosted AI allowance, the RAZORPAY_* values to take
# rupee payments and the DODO_* values to take dollar payments. The full walk-through is docs/launch.md.
# Check plan names and prices on render.com before you deploy.
databases:
  - name: careeros-db
    databaseName: careeros
    user: careeros

services:
  - type: web
    name: careeros-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    preDeployCommand: careeros cloud migrate
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careeros-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SIGNUP_MODE
        value: open
      - key: SUPPORT_EMAIL
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: SECRETS_KEY
        generateValue: true
      - key: PRO_PRICE_INR
        value: "499"
      - key: ULTRA_PRICE_INR
        value: "1199"
      - key: FREE_AI_CREDITS
        value: "15"
      - key: PRO_AI_CREDITS
        value: "400"
      - key: ULTRA_AI_CREDITS
        value: "1500"
      - key: CAREEROS_LLM
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PLAN_PRO
        sync: false
      - key: RAZORPAY_PLAN_ULTRA
        sync: false
      - key: DODO_API_KEY
        sync: false
      - key: DODO_WEBHOOK_SECRET
        sync: false
      - key: DODO_PRODUCT_PRO
        sync: false
      - key: DODO_PRODUCT_ULTRA
        sync: false
      - key: DODO_MODE
        value: test

  - type: worker
    name: careeros-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: careeros cloud worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careeros-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_URL
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: SIGNUP_MODE
        value: open
      - key: SECRETS_KEY
        fromService:
          type: web
          name: careeros-web
          envVarKey: SECRETS_KEY
      # The worker cancels a replaced subscription after a plan change, so it needs the payment keys too.
      - key: RAZORPAY_KEY_ID
        fromService:
          type: web
          name: careeros-web
          envVarKey: RAZORPAY_KEY_ID
      - key: RAZORPAY_KEY_SECRET
        fromService:
          type: web
          name: careeros-web
          envVarKey: RAZORPAY_KEY_SECRET
      - key: RAZORPAY_PLAN_PRO
        fromService:
          type: web
          name: careeros-web
          envVarKey: RAZORPAY_PLAN_PRO
      - key: RAZORPAY_PLAN_ULTRA
        fromService:
          type: web
          name: careeros-web
          envVarKey: RAZORPAY_PLAN_ULTRA
      - key: DODO_API_KEY
        fromService:
          type: web
          name: careeros-web
          envVarKey: DODO_API_KEY
      - key: DODO_PRODUCT_PRO
        fromService:
          type: web
          name: careeros-web
          envVarKey: DODO_PRODUCT_PRO
      - key: DODO_PRODUCT_ULTRA
        fromService:
          type: web
          name: careeros-web
          envVarKey: DODO_PRODUCT_ULTRA
      - key: DODO_MODE
        fromService:
          type: web
          name: careeros-web
          envVarKey: DODO_MODE
      - key: SUPPORT_EMAIL
        sync: false
