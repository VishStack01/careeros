<!doctype html>
<html><head><meta charset="utf-8"><title>Apply: Graduate Engineer Trainee at Acme</title></head>
<body>
<h1>Graduate Engineer Trainee</h1>
<form>
  <div class="field"><label for="cg">CGPA *</label><input id="cg" type="text" required></div>
  <div class="field"><label for="br">Branch</label><input id="br" type="text"></div>
  <div class="field"><label for="st">State</label><input id="st" name="state" type="text"></div>
  <div class="field"><label for="pin">PIN code</label><input id="pin" type="text"></div>
  <div class="field"><label for="why">Why do you want to work at Acme?</label><textarea id="why"></textarea></div>
  <div class="field"><label for="proud">Tell us about a project you are proud of</label><textarea id="proud"></textarea></div>
  <div class="field"><label for="leave">Please state your reasons for leaving your current role</label><textarea id="leave"></textarea></div>
</form>
</body></html>
