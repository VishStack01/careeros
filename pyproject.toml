[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "0.1.0"
description = "Evidence-first job application agent: finds fresh roles, verifies them on source, tailors truthful applications and applies with you in control."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "VishStack" }]
keywords = ["job-search", "agents", "claude-code", "ats", "automation", "careers"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.44"]
cloud = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "psycopg[binary,pool]>=3.1", "pypdf>=4.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
careeros = "careeros.cli:main"

[tool.setuptools.packages.find]
include = ["careeros*"]

[tool.setuptools.package-data]
careeros = ["site_app.html", "cloud/static/*.html", "cloud/migrations/*.sql", "cloud/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
