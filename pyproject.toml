[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "1.1.1"
description = "Open-source AI agent for the job search: finds fresh roles, checks them with quotes from the posting, writes applications from your real experience only. Bring your own model and key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Venkata Vishnu Vardhan Raju Chakravarthula" }]
keywords = ["job-search", "ai-agent", "llm", "claude-code", "ats", "resume", "careers", "bring-your-own-key"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://vishstack01.github.io/careeros/"
Documentation = "https://vishstack01.github.io/careeros/docs.html"
Repository = "https://github.com/VishStack01/careeros"
Issues = "https://github.com/VishStack01/careeros/issues"
Changelog = "https://github.com/VishStack01/careeros/blob/main/CHANGELOG.md"

[project.optional-dependencies]
browser = ["playwright>=1.44"]
cloud = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "psycopg[binary,pool]>=3.1", "pypdf>=4.0", "cryptography>=42"]
radar = ["python-jobspy>=1.4"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
careeros = "careeros.cli:main"

[tool.setuptools.packages.find]
include = ["careeros*"]

[tool.setuptools.package-data]
careeros = ["site_app.html", "data/*.json", "cloud/static/*.html", "cloud/static/app/*.html", "cloud/static/app/*.js", "cloud/static/app/*.webmanifest", "cloud/static/app/icons/*.png", "cloud/migrations/*.sql", "cloud/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
