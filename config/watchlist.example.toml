# Company career boards to poll. These are the public JSON feeds behind each
# company's own careers page: the fastest, most accurate source, and the place
# you should apply from.
#
# Find a company's board:
#   Greenhouse  job-boards.greenhouse.io/<token>   -> ats = "greenhouse", token = "<token>"
#   Lever       jobs.lever.co/<token>              -> ats = "lever",      token = "<token>"
#   Ashby       jobs.ashbyhq.com/<token>           -> ats = "ashby",      token = "<token>"

