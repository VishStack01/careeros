name: scan

# Hourly: find company job boards, read every board plus the remote job boards
# with public feeds, publish the result to the `feed` branch as
# feed/india.jsonl.gz, and rebuild the public job board on GitHub Pages.
# The feed and the board are public lists of openings, not anyone's personal
# data; personal filters run elsewhere (`careeros filter-feed`).
#
# GitHub delays or drops scheduled runs when it is busy, so the schedule asks
# every hour at an off-peak minute; caches keep the polite polling limits.

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      rediscover:
        description: "Re-check every company's job board from scratch"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Restore the last feed (board map and caches)
        run: |
          if git fetch --depth 1 origin feed 2>/dev/null; then
            git archive FETCH_HEAD feed | tar -x
          fi
          mkdir -p feed
          if [ "${{ inputs.rediscover }}" = "true" ]; then rm -f feed/boards.json; fi

      - name: Hiring radar (every third run)
        # JobSpy reads Indeed India and Naukri to learn which companies are hiring.
        # Only employer board links and company names are kept; see careeros/sources/radar.py.
        continue-on-error: true
        run: |
          if [ $(( 10#$(date -u +%H) % 3 )) -eq 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            pip install "python-jobspy>=1.4" >/dev/null 2>&1 || true
            careeros radar --config config/radar.toml --boards feed/boards.json --out feed/radar-companies.csv 2>&1 | tee feed/radar.log
          fi

      - name: Deep sweep list (daily)
        # ~20,000 company boards from the open ats-scrapers inventory (MIT). Only the list is
        # refreshed here; discover checks them a few hundred at a time and keeps the boards
        # that list developer roles in India or open to it.
        continue-on-error: true
        run: |
          if [ ! -f feed/deep-companies.csv ] || [ $(( 10#$(date -u +%H) )) -eq 4 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            careeros deep --boards feed/boards.json --out feed/deep-companies.csv 2>&1 | tee feed/deep.log
          fi

      - name: Discover job boards
        # New companies, boards that errored last scan, and unmapped companies
        # every 14 days (swept boards every 21). At most 800 per run and 18 minutes,
        # curated and radar companies first, so the first deep pass takes a day or
        # two and stays gentle on each hiring system.
        run: |
          set -o pipefail
          careeros discover --companies config/companies/companies.csv --extra feed/radar-companies.csv --extra feed/deep-companies.csv --cache feed/boards.json --refresh-days 14 --limit 800 --max-minutes 18 2>&1 | tee feed/discover.log

      - name: Scan boards
        run: |
          set -o pipefail
          careeros scan --boards feed/boards.json --out feed 2>&1 | tee feed/scan.log

      - name: Newly funded companies, for you to review
        # Funding headlines from Inc42, Entrackr and TechCrunch India. Nothing is
        # added to the company list until you run `careeros funded --add`.
        continue-on-error: true
        run: careeros funded --json --days 30 > feed/funded.json

      - name: Package the filter tool next to the feed
        # One-file copy of careeros (python3 careeros.pyz ...) for agents that
        # can download files but can't clone repositories.
        if: always()
        run: |
          app="$RUNNER_TEMP/app"
          mkdir -p "$app" feed
          cp -r careeros "$app/"
          find "$app" -name __pycache__ -prune -exec rm -rf {} +
          printf 'from careeros.cli import main\nmain()\n' > "$app/__main__.py"
          python -m zipapp "$app" -o feed/careeros.pyz
          cp config/platforms.toml feed/platforms.toml
          python feed/careeros.pyz --version

      - name: Publish to the feed branch
        # Also after a failed step, so the board map and the logs are kept.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pub="$RUNNER_TEMP/pub"
          mkdir -p "$pub"
          cp -r feed "$pub/feed"
          cd "$pub"
          printf '# CareerOS feed\n\nOpen tech roles in India and remote, regenerated every 3 hours by `.github/workflows/scan.yml` on the main branch.\n\n- `feed/india.jsonl.gz`: one role per line\n- `feed/summary.json`: counts and errors\n- `feed/boards.json`: which job board each company uses\n- `feed/unmapped.csv`: companies whose career site has no public feed\n- `feed/careeros.pyz`: the filter tool in one file (`python3 careeros.pyz filter-feed ...`)\n\nSee docs/feed.md on main.\n' > README.md
          git init -q -b feed
          git config user.name "careeros-bot"
          git config user.email "careeros-bot@users.noreply.github.com"
          git add -A
          git commit -qm "feed: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feed
          python -c "import json; s=json.load(open('feed/summary.json')); print(f\"{s['openings']} openings from {s['boards']} company boards; remote boards: {s.get('remoteBoards')}\")" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Build the job board
        if: always()
        run: |
          base="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          careeros site --feed feed --out site --demo dashboard/index.html --base-url "$base"

      - uses: actions/configure-pages@v5
        if: always()

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
