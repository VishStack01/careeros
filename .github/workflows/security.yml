name: security

on:
  push:
  pull_request:
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: read

jobs:
  dependencies:
    name: Known vulnerabilities in dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - run: pip install -e ".[browser,cloud]"
      - run: pip-audit --skip-editable --progress-spinner off

  secrets:
    name: No secrets in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  private-data:
    name: No personal data tracked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Private files stay untracked
        run: |
          python -c "from careeros.doctor import PRIVATE; import subprocess, sys; t = subprocess.run(['git', 'ls-files', '--', *PRIVATE], capture_output=True, text=True).stdout.split(); print('tracked:', t or 'none'); sys.exit(1 if t else 0)"
