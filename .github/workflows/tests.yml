name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: careeros
          POSTGRES_DB: careeros_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careeros" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CAREEROS_TEST_POSTGRES_URL: postgresql://careeros:careeros@localhost:5432/careeros_test
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[browser,cloud,dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q
      - name: Package data ships with the cloud app
        run: |
          pip install build && python -m build --wheel --outdir dist
          python -m zipfile -l dist/*.whl | grep -E "cloud/(static/dashboard.html|static/pricing.html|static/app/manifest.webmanifest|static/app/icons/icon-512.png|migrations/0002_plans.sql|prompts/apply.md)"
