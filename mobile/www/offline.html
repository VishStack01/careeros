<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Propelo · Offline</title>
<meta name="theme-color" content="#FAF3E6">
<style>
:root{--cream:#FAF3E6;--ink:#151515;--text:#4F4A44;--pink:#FF85BA}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;overflow:hidden}
main{text-align:center;padding:24px;margin-top:-8vh}
h1{font-size:40px;font-weight:500;letter-spacing:-.04em;margin:0}
.brand{display:inline-flex;align-items:baseline;gap:2px;margin-bottom:24px;font-size:24px;font-weight:600;letter-spacing:-.05em}
.brand i{width:7px;height:7px;border-radius:50%;background:var(--pink)}
p{margin:8px 0 24px;color:var(--text)}
a{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--cream);border-radius:999px;padding:12px 24px;font-weight:500;text-decoration:none}
a:active{transform:scale(.98)}
a svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.s{position:fixed}
.s svg{width:100%;height:100%}
@media (prefers-color-scheme:dark){:root{--cream:#12110F;--ink:#F3EDE2}body{color-scheme:dark}p{color:#D6CFC3}a{background:#F3EDE2;color:#151515}}
</style>
</head>
<body>
<main>
  <div class="brand">propelo<i></i></div>
  <h1>You're offline</h1>
  <p>Propelo will load again when your connection is back</p>
  <a href="/">Retry <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v5h-5"/></svg></a>
</main>
</body>
</html>
